body{margin:0;min-height:100vh;background:linear-gradient(180deg,#f7fbfb,#eff4f2);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#2d4b4d}
.shell{width:min(460px,92vw);margin:28px auto;background:#fff;border-radius:28px;box-shadow:0 16px 40px rgba(0,0,0,.08);padding:30px 22px 26px;border:1px solid rgba(0,0,0,.05)}

.word{display:flex;align-items:center;gap:12px;border:1px solid #e6eaf0;border-radius:16px;padding:10px 12px;margin:8px 0;cursor:pointer;background:#fbfcfd}

.word .he{font-size:1.6rem;flex:1;text-align:right}
.word .en{font-size:.85rem;color:#6b7684;text-align:left;width:40%}
.word .en i{display:block;color:#2d4b4d;font-size:.95rem}
.sent{font-size:1.5rem;text-align:right;line-height:1.6;background:#f5f7fa;border-radius:16px;padding:12px 16px}
.btn{display:block;width:100%;border:none;border-radius:18px;padding:16px 20px;margin:10px auto 0;color:#fff;font-size:1rem;font-weight:800;box-shadow:0 10px 24px rgba(0,0,0,.11);cursor:pointer}
.btn.back{background:linear-gradient(135deg,#b6c0c0,#9ea9ab)}
.btn.ai{background:linear-gradient(135deg,#9747b3,#b05ad0)}
.row{display:flex;gap:10px}.row .btn{margin-top:10px}
a.unit{display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:#2d4b4d;border:1px solid #e6eaf0;border-radius:16px;padding:12px 16px;margin:8px 0;background:#fbfcfd}
a.unit .he{font-size:1.5rem;font-weight:700}
